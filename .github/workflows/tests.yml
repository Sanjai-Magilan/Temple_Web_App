name: Test for all branches

on:
  pull_request:
    branches: ["dev"]
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up MySQL
        uses: mirromutth/mysql-action@v1.1
        with:
          mysql root password: root
          mysql database: temple_db

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test
