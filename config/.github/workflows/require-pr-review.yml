name: Require PR Review Approval

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - review_requested
      - review_request_removed
  pull_request_review:
    types:
      - submitted

jobs:
  check-approvals:
    runs-on: ubuntu-latest

    steps:
      - name: Check approved reviews
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let pull_number;

            if (context.payload.pull_request && context.payload.pull_request.number) {
              pull_number = context.payload.pull_request.number;
            } else if (
              context.payload.review &&
              context.payload.review.pull_request &&
              context.payload.review.pull_request.number
            ) {
              pull_number = context.payload.review.pull_request.number;
            } else {
              core.setFailed("Unable to determine pull request number from event payload.");
              return;
            }
            const reviews = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number,
            });

            // Consider only the latest review per reviewer
            const latestReviewsByUser = new Map();
            for (const review of reviews.data) {
              const userId = review.user && review.user.id;
              if (!userId) continue;

              const existing = latestReviewsByUser.get(userId);
              if (
                !existing ||
                (review.submitted_at && !existing.submitted_at) ||
                (review.submitted_at &&
                  existing.submitted_at &&
                  new Date(review.submitted_at) > new Date(existing.submitted_at))
              ) {
                latestReviewsByUser.set(userId, review);
              }
            }

            const latestReviews = Array.from(latestReviewsByUser.values());

            const approvals = latestReviews.filter(
              review => review.state === "APPROVED"
            );

            const REQUIRED_APPROVALS = 1;

            if (approvals.length < REQUIRED_APPROVALS) {
              core.setFailed(
                `❌ ${REQUIRED_APPROVALS} approval(s) required. Found ${approvals.length}.`
              );
            } else {
              console.log(`✅ ${approvals.length} approval(s) found.`);
            }
