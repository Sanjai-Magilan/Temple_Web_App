name: Require PR Review Approval

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - review_requested
      - review_request_removed
  pull_request_review:
    types:
      - submitted

jobs:
  check-approvals:
    runs-on: ubuntu-latest

    steps:
      - name: Check approved reviews
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const reviews = await github.rest.pulls.listReviews({
              owner,
              repo,
              pull_number,
            });

            const approvals = reviews.data.filter(
              review => review.state === "APPROVED"
            );

            const REQUIRED_APPROVALS = 1;

            if (approvals.length < REQUIRED_APPROVALS) {
              core.setFailed(
                `❌ ${REQUIRED_APPROVALS} approval(s) required. Found ${approvals.length}.`
              );
            } else {
              console.log(`✅ ${approvals.length} approval(s) found.`);
            }
